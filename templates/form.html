{% extends "base.html" %}{% block content %}
<h2>{{ title }}</h2>{% if subtitle %}<p class="sub">{{ subtitle }}</p>{% endif %}
<form method="post" class="form">
{% for f in fields %}<label>{{ f[1] }}</label>
{% if f[2] == "select" %}<select name="{{ f[0] }}" required>{% for v, t in f[3] %}<option value="{{ v }}">{{ t }}</option>{% endfor %}</select>
{% elif f[2] == "number" %}<input name="{{ f[0] }}" type="number" step="0.01" min="0" required>
{% else %}<input name="{{ f[0] }}" type="{{ f[2] }}" {% if f[0] != "address" and f[0] != "description" %}required{% endif %}>{% endif %}{% endfor %}
<button class="btn">{{ submit }}</button></form>{% endblock %}
